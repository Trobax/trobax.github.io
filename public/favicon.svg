<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Terminal window background -->
  <rect width="32" height="32" rx="6" fill="#0a0c10"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="5.5" stroke="#232b37" stroke-width="1"/>
  
  <!-- Terminal prompt: >_ -->
  <!-- Greater-than symbol (>) in terminal green #4ade80 -->
  <path d="M7 9 L15 16 L7 23" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Blinking cursor (_) in terminal green #4ade80 -->
  <line x1="17" y1="23" x2="25" y2="23" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>
</svg>